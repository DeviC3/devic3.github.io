<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mój Blog</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Biblioteka do renderowania Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js dla kodu -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.7.0/build/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.7.0/build/highlight.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Mój Blog</h1>
        </header>
        
        <main id="content">
            <!-- Tutaj zostanie wczytana zawartość -->
            <div id="article-list"></div>
            <div id="article-content" style="display: none;"></div>
        </main>
    </div>

    <script>
        // Funkcja do wczytywania listy artykułów
        async function loadArticleList() {
            const response = await fetch('articles/');
            const text = await response.text();
            const parser = new DOMParser();
            const html = parser.parseFromString(text, 'text/html');
            
            // Znajdź wszystkie linki do plików .md
            const links = Array.from(html.querySelectorAll('a'))
                .filter(a => a.href.endsWith('.md'))
                .map(a => {
                    const filename = a.href.split('/').pop();
                    return {
                        name: filename.replace('.md', '').replace(/-/g, ' '),
                        path: a.href
                    };
                });
            
            // Wyświetl listę artykułów
            const listContainer = document.getElementById('article-list');
            listContainer.innerHTML = `
                <h2>Artykuły</h2>
                <ul>
                    ${links.map(article => `
                        <li>
                            <a href="#" onclick="loadArticle('${article.path}')">${article.name}</a>
                        </li>
                    `).join('')}
                </ul>
            `;
        }

        // Funkcja do wczytywania pojedynczego artykułu
        async function loadArticle(path) {
            const response = await fetch(path);
            const markdown = await response.text();
            
            // Renderuj Markdown do HTML
            document.getElementById('article-content').innerHTML = `
                <button onclick="showArticleList()">← Wróć do listy</button>
                <div class="article">${marked.parse(markdown)}</div>
            `;
            
            // Podświetl składnię kodu
            document.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });
            
            // Pokaż artykuł, ukryj listę
            document.getElementById('article-list').style.display = 'none';
            document.getElementById('article-content').style.display = 'block';
        }

        // Funkcja do powrotu do listy artykułów
        function showArticleList() {
            document.getElementById('article-list').style.display = 'block';
            document.getElementById('article-content').style.display = 'none';
        }

        // Inicjalizacja
        loadArticleList();
    </script>
</body>
</html>
